name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# WHAT IS GATED, AND WHY IT IS SCOPED THAT WAY
#
# The shipping artifacts are `rusty_zstd` (published), `rusty_zstd-cli` and the
# `rzstd-alloc` seam. Those are held to `-D warnings` and tested on three OSes.
#
# `rusty_zstd-bench` is the campaign harness: 455 one-off measurement
# instruments that need a pinned C `zstd` binary and multi-gigabyte corpora this
# runner does not have. It is checked for compilation in the configuration it is
# actually built in (`--features profile`), which is the useful signal; holding
# its historical instruments to `-D warnings` would gate nothing a consumer sees.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p rusty_zstd -p rusty_zstd-cli -p rzstd-alloc
      # KERNEL REACH. A twin that exists but is not CALLED passes every other
      # gate in this file: byte-identity passes because the two paths agree by
      # design, the round-trip passes, and an arm-toggle A/B reads FLAT --
      # indistinguishable from "the kernel does not help". Exactly that shipped
      # here: the xxh64 AVX2 kernel was reachable only from a test and a bench,
      # and DECODE ran it on 0% of its bytes for months. This counts instead.
      #
      # Needs `profile` for the census taps (they compile to nothing without
      # it, so the shipped build is unaffected). Slots whose ISA the runner
      # lacks are skipped, not failed.
      - name: Kernel reach gate
        run: cargo test -p rusty_zstd --release --features profile --test kreach_gate -- --nocapture
      # The gate must be able to FAIL. Forcing every arm scalar has to break
      # it; if this step SUCCEEDS, the census is detached from the dispatch it
      # names and the green run above meant nothing.
      - name: Kernel reach gate self-check (must fail)
        shell: bash
        run: |
          if RZSTD_KREACH_POISON=1 cargo test -p rusty_zstd --release --features profile --test kreach_gate; then
            echo '::error::kreach gate passed with every arm forced scalar -- the census is not wired'
            exit 1
          fi
          echo 'poison check ok: the gate fails when the arms are forced scalar'
      - name: Doc tests (the README's examples)
        run: cargo test -p rusty_zstd --doc
      - name: CLI version + aliases
        run: |
          cargo run -p rusty_zstd-cli --bin rzstd -- --version
          cargo run -p rusty_zstd-cli --bin unzstd -- --version
          cargo run -p rusty_zstd-cli --bin zstdcat -- --version
          cargo run -p rusty_zstd-cli --bin zstdmt -- --version

  # The portable configurations the README advertises, so they cannot rot.
  portable:
    name: no_std + wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: no_std + alloc
        run: cargo check -p rusty_zstd --no-default-features --features alloc
      - name: wasm32 (std)
        run: cargo check -p rusty_zstd --target wasm32-unknown-unknown --no-default-features --features std
      - name: wasm32 (alloc)
        run: cargo check -p rusty_zstd --target wasm32-unknown-unknown --no-default-features --features alloc
      - name: profile feature builds
        run: cargo check -p rusty_zstd --features profile

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p rusty_zstd -p rusty_zstd-cli -p rzstd-alloc -- --check
      - run: cargo clippy -p rusty_zstd -p rusty_zstd-cli -p rzstd-alloc --all-targets -- -D warnings
      - name: ASCII sources
        run: bash scripts/check-ascii-rs.sh crates
      # An ISA twin is byte-identical to its baseline sibling by construction,
      # so the whole correctness suite is blind to every way a twin can be
      # wrong. This catches the two source-level ways -- see the script header.
      # It has already found a live one: `decode_4x_bmi2` compiled with AVX2
      # enabled while dispatched on `has_bmi2()` alone.
      - name: ISA twin guard
        run: python3 scripts/twinguard.py
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  # The campaign harness, in the configuration it is actually built in.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rusty_zstd-bench --all-targets --features profile

  # Catches a broken manifest, a missing README, or a file the package would
  # ship without -- before `cargo publish` does, not after.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: its prune walks target/package/ and annotates on
      # directories a packaged crate does not have. Nothing to reuse anyway.
      - run: cargo package -p rusty_zstd --allow-dirty
