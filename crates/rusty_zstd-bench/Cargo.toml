[package]
name = "rusty_zstd-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Harness: shells out to pinned C zstd; never links libzstd"
readme = "README.md"
# Build the examples with `--features profile`: over half of the 455 instruments
# read counters that only exist behind it. `profile` is deliberately NOT a default
# feature -- the profiler has a real timing tax, and a speed board taken with it
# compiled in is not admissible. See README.md.
publish = false

[[bin]]
name = "rzstd-bench"
path = "src/main.rs"

[dependencies]
rusty_zstd = { path = "../rusty_zstd" }
rzstd-alloc = { path = "../rzstd-alloc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_WindowsProgramming",
] }

# `dsloop` drives the DecSeq loop-anatomy ladder, which only exists behind
# `dupladder` -- it adds a per-sequence arm dispatch to the very loop it
# measures, so it is opt-in rather than part of `profile`.
[[example]]
name = "dsloop"
path = "examples/dsloop.rs"
required-features = ["dupladder"]

[features]
profile = ["rusty_zstd/profile"]
dupladder = ["profile", "rusty_zstd/dupladder"]

[lints]
workspace = true

