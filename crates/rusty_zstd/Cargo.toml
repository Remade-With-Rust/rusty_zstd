[package]
name = "rusty_zstd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A ground-up, pure-Rust Zstandard (RFC 8878) compressor and decompressor. Levels -7..22 with all nine libzstd strategies, dictionaries + trainer, long-distance matching, seekable frames, multi-threading. Interoperable both directions with facebook/zstd v1.5.7, dual-gated per commit. Zero dependencies by default, no C, no *-sys, no FFI; builds on no_std + alloc and wasm32. MIT OR Apache-2.0."
documentation = "https://docs.rs/rusty_zstd"
readme = "README.md"
keywords = ["zstd", "zstandard", "compression", "codec", "no-std"]
categories = ["compression", "encoding", "no-std"]

# The default build still has no dependencies and no build script; the optional
# `rusty-alloc` feature is the only thing that adds one. Document the default
# (std) surface.
[package.metadata.docs.rs]
all-features = false

[lib]
name = "rusty_zstd"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
legacy = ["std"]
seekable = ["std"]
train = ["std"]
mt = ["std"]
profile = ["std"]
# Install rusty_alloc as the process-wide allocator.
#
# OFF by default, and that is deliberate rather than cautious. `rusty_alloc_default`
# declares the `#[global_allocator]`, and a program may define exactly ONE. Around
# twenty deliverables in this portfolio install their own seam -- deputy-alloc,
# atlas-alloc, faceless-alloc, mata-alloc, ffai-cli and the rest -- and every one of
# them embeds a codec. Turning this on by default would stop them linking until each
# added `default-features = false` here.
#
# It also cannot be made automatic. Cargo unifies features across a build, so one
# consumer enabling this imposes it on every other consumer in the same graph; the
# feature is a property of the build, not of one dependent. There is no
# `cfg(has_global_allocator)` to test either -- `#[global_allocator]` is resolved at
# link time, which is why the collision is caught by `links` (see rzstd-alloc)
# rather than by detection.
rusty-alloc = ["dep:rusty_alloc_default"]
# DecSeq loop anatomy ladder (`dsloop.rs`). Adds a per-sequence arm dispatch to
# the decode loop, so it is NOT part of `profile`: it perturbs the very loop it
# measures and must be built on purpose.
dupladder = ["profile"]
# `pfcensus` -- the D9 prefetch COVERAGE counters. Separate from `profile`
# because they fire PER SEQUENCE: two atomics per sequence made a `profile`
# build read D9 at +14.3% when the untaxed brick reads +0.2%. The tap must
# not be in the build that measures the thing (codec-measurement 6).
pfcensus = ["profile"]

[dependencies]
# Optional, and off unless `rusty-alloc` is enabled: with the feature off this
# crate still resolves to zero dependencies, which is the property the crate
# description claims.
rusty_alloc_default = { version = "0.1.1", optional = true }

[lints]
workspace = true
