[package]
name = "rusty_zstd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "zstd-compatible CLI for rusty_zstd (M6: MT, list, bench, aliases)"
publish = false

[lib]
name = "rusty_zstd_cli"
path = "src/lib.rs"

# The four installed names are four shims in src/bin/ over one `entry()`; the
# mode each implies is read off argv[0]. Four `[[bin]]` targets sharing a single
# `path` is what Cargo warns about, and it is deprecated.

[dependencies]
rzstd-alloc = { path = "../rzstd-alloc" }
rusty_zstd = { path = "../rusty_zstd" }
thoth = { git = "https://github.com/Remade-With-Rust/thoth", tag = "v0.3.0", default-features = false }

[lints]
workspace = true
