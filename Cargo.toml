[workspace]
resolver = "2"
members = [
    "crates/rusty_zstd",
    "crates/rusty_zstd-cli",
    "crates/rusty_zstd-bench",
    "crates/rzstd-alloc",
]

# The on-board proof (bare-metal/esp32s3) is a firmware crate for Xtensa: it
# needs Espressif's Rust fork and its own linker script, so it must not be a
# workspace member. Excluded, a plain `cargo build` at the root never sees it.
exclude = ["bare-metal/esp32s3"]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/rusty_zstd"
authors = ["Mata Network <https://www.mata.network>"]
homepage = "https://www.mata.network/remade-with-rust"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"

# Clippy is denied wholesale in CI, so the exceptions are declared here rather
# than sprinkled through the source. Both are shape, not smell: an entropy or
# match-find kernel takes the state it needs by argument precisely so it does
# NOT reach through a struct in the hot loop, and the tuple returns are the
# census shapes the bench harness reads.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

# THE JSON SWAP (rusty_json_turbo). One table converts the WHOLE graph.
#
# `serde_json` here is the house fork, `Remade-With-Rust/rusty_json_turbo`: a
# performance fork whose output is byte-identical to upstream's by contract,
# gated per commit against upstream serde_json linked in the same process --
# bytes, `Value`, error text with line and column, float bit patterns and
# `StreamDeserializer` offsets. Its LIBRARY is still called `serde_json`, so
# every `use serde_json::...` line in this repository is untouched.
#
# WHY A PATCH AND NOT A RENAMED DEPENDENCY. Writing
# `serde_json = { package = "rusty_json_turbo", ... }` would convert only the
# JSON this repository calls itself, leaving every third-party copy on
# upstream -- and the two would then be DIFFERENT TYPES, so a `Value` handed
# across that boundary would not compile. A patch converts every copy at once
# and leaves exactly one `Value` in the graph.
#
# The patch target is a shim package inside the fork named `serde_json`, which
# exists because `[patch]` matches on PACKAGE name and the fork's package is
# `rusty_json_turbo`. See that repository's `crates/serde_json-shim/`.
[patch.crates-io]
serde_json = { git = "https://github.com/Remade-With-Rust/rusty_json_turbo", branch = "master" }
